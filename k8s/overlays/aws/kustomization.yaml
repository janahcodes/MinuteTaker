# Local kind cluster, REAL managed AWS services (DynamoDB, S3, SQS in us-east-2).
# Generated inputs (not committed): aws-config.yaml and creds.env, written by
# scripts/use-real-aws.sh from `terraform output`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: minutetaker
resources:
  - ../../base
patches:
  - path: aws-config.yaml           # real table / bucket / queue names
  - target: { kind: Deployment, name: "api|worker" }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value: { secretRef: { name: aws-app-creds } }
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target: { kind: Deployment, name: web }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target: { kind: Service, name: web }
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
secretGenerator:
  # Keys of the least-privilege IAM user from infra/iam.tf. On EKS this would be
  # EKS Pod Identity instead of a static key.
  - name: aws-app-creds
    envs: [creds.env]
generatorOptions:
  disableNameSuffixHash: true
