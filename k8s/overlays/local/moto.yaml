# Stand-in for the managed AWS services when running locally.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moto
  labels: { app: moto }
spec:
  replicas: 1
  selector: { matchLabels: { app: moto } }
  template:
    metadata: { labels: { app: moto } }
    spec:
      # Without this, k8s injects MOTO_PORT=tcp://<ip>:5000 (from the Service
      # named "moto"), which moto reads as its own port setting and crashes.
      enableServiceLinks: false
      containers:
        - name: moto
          image: motoserver/moto:5.0.26
          ports: [{ name: http, containerPort: 5000 }]
          readinessProbe:
            httpGet: { path: /moto-api/, port: http }
            periodSeconds: 3
          resources:
            # moto keeps every uploaded recording in RAM. A 1Gi limit got it
            # OOMKilled after ~40 uploads, which wiped all emulated resources.
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 3Gi }
        # Self-healing: moto loses everything when it restarts, and the API then
        # fails readiness on every pod (site-wide 502). This sidecar re-creates
        # the table, bucket and queues within ~15 s of any moto restart.
        - name: ensure-resources
          image: amazon/aws-cli:2.22.0
          command: ["/bin/sh", "-c", "while true; do sh /init/init-local-aws.sh >/dev/null 2>&1 || echo 'init failed, retrying'; sleep 15; done"]
          envFrom:
            - configMapRef: { name: minutetaker-config }
            - secretRef: { name: local-aws-creds }
          env:
            - { name: AWS_ENDPOINT_URL, value: "http://localhost:5000" }
          volumeMounts: [{ name: init, mountPath: /init }]
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: init
          configMap: { name: init-local-aws }
---
apiVersion: v1
kind: Service
metadata:
  name: moto
spec:
  selector: { app: moto }
  ports: [{ name: http, port: 5000, targetPort: http }]
---
# Creates the table, bucket and queues. Re-run it (delete + apply) if the
# moto pod restarts, since moto keeps everything in memory.
apiVersion: batch/v1
kind: Job
metadata:
  name: init-local-aws
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: amazon/aws-cli:2.22.0
          command: ["/bin/sh", "/init/init-local-aws.sh"]
          envFrom:
            - configMapRef: { name: minutetaker-config }
            - secretRef: { name: local-aws-creds }
          volumeMounts: [{ name: init, mountPath: /init }]
      volumes:
        - name: init
          configMap: { name: init-local-aws }
