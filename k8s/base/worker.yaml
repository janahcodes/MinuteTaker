apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: { app: worker }
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      serviceAccountName: worker
      # On scale-in / rollout the worker gets SIGTERM, stops taking new jobs and
      # finishes the current one. Anything longer than this grace period is
      # killed; its SQS message then reappears and another worker redoes it.
      terminationGracePeriodSeconds: 90
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: worker } }
      containers:
        - name: worker
          image: minutetaker-worker
          ports: [{ name: health, containerPort: 8081 }]
          envFrom:
            - configMapRef: { name: minutetaker-config }
          env:
            - { name: VISIBILITY_TIMEOUT, value: "120" }
            - { name: MAX_RECEIVES, value: "3" }
            - { name: CPU_THREADS, value: "1" }
            - { name: STALL_AFTER_S, value: "300" }
          # Transcription is CPU-bound: one core per job. The HPA scales on
          # CPU, so a busy worker (~100% of its limit) triggers a scale-out.
          resources:
            requests: { cpu: 500m, memory: 600Mi }
            limits: { cpu: "1", memory: 1Gi }
          startupProbe:          # model load takes a few seconds on a cold node
            httpGet: { path: /healthz, port: health }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:         # fails if the poll loop hasn't ticked in STALL_AFTER_S
            httpGet: { path: /healthz, port: health }
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:        # model loaded and loop alive
            httpGet: { path: /readyz, port: health }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }   # downloaded audio
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: worker }
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{ type: Pods, value: 2, periodSeconds: 30 }]
    scaleDown:
      # Wait before removing workers so a short pause between jobs doesn't
      # cause flapping (and needless SIGTERMs mid-job).
      stabilizationWindowSeconds: 180
      policies: [{ type: Pods, value: 1, periodSeconds: 60 }]
